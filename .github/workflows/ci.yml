name: CI

# Cost-aware matrix:
#   - every PR + push:  engine unit tests (Node 20/22/24) + stamp-android (ubuntu)
#   - manual dispatch only (parked):   stamp-ios (iOS out of active scope for now)
# The stamp jobs prove the CURRENT checkout's engine + template produce a
# project that actually builds — the reproducibility moat's gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: engine unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      # WHOLE HISTORY, and without it one gate in the suite is green by
      # construction. `scripts/ground-truth.mjs` decides whether a published
      # version number still names these bytes by walking each manifest back to
      # the commit that set its version. The default checkout is depth 1, so that
      # walk anchors on the PR head and compares it against itself. Measured:
      # same bytes, same head — a full clone refuses and a depth-1 clone exits 0.
      # The derivation now refuses a shallow history rather than trusting this
      # line, so deleting it turns the suite red instead of silently vacuous.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm ci`, not `npm install`. The difference is the whole point: `npm ci`
      # installs strictly from the lock and REFUSES one that disagrees with the
      # manifests, where `npm install` quietly repairs it. That permissiveness
      # hid a lock desync for a whole release — `npm ci` was broken for every
      # fresh clone while CI stayed green, because CI was the one install that
      # could not fail (2026-09-09). CI now installs the way a stranger does.
      #
      # ONE install, not two. inspector/mcp IS a workspace (see the root
      # manifest), and the root lock records its deps at
      # inspector/mcp/node_modules/@modelcontextprotocol/sdk — nested, resolved
      # by the same `npm ci`. The second `--prefix inspector/mcp` step this
      # replaces carried a comment claiming the opposite ("a SEPARATE package,
      # not a workspace"); that was true once and outlived the change that made
      # it a workspace. Verified by running a clean root `npm ci` and resolving
      # the sdk from inspector/mcp before this was cut.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        # `npm test`, never a second spelling of the runner: the declared suite is
        # package.json's `test` script and CI must run THAT, not its own idea of it.
        run: npm test

  stamp-android:
    name: stamp + Android assembleDebug, then add firebase + assembleDebug, then the lean shape
    runs-on: ubuntu-latest # JDK + Android SDK preinstalled; licenses accepted
    needs: test # don't burn a Gradle build on a broken engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gradle build/config caches, auto-keyed on gradle files (incl. the
      # template's version catalog once stamped). PRs read-only so they can't
      # poison the main cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Engine is zero-dep in non-interactive mode (prompts/picocolors are
      # optional imports) — no npm install needed to stamp.
      - name: Stamp project (verify off — the build IS the verification here)
        run: >
          node bin/create-cmp.mjs "$RUNNER_TEMP/ci-smoke"
          --name CiSmoke --package com.ci.smoke
          --no-ios --no-verify --yes
      - name: Build stamped project (Android)
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ci-smoke"
          ./gradlew :composeApp:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      # Firebase left stamp-time for `create-cmp add firebase`. This is its proof at the compile
      # tier: the add step on the SAME app the default stamp just built, then the build again —
      # the GitLive modules, the google-services plugin over the mock config it writes, the
      # appended BuildConfig block and FirebaseEmulators.kt all compile, or this job is red.
      # Runtime (init + the four useEmulator calls) is not proven here.
      - name: Add Firebase to the stamped project (verify off — the build below IS the verification)
        run: node bin/create-cmp.mjs add firebase "$RUNNER_TEMP/ci-smoke" --no-verify
      - name: Build the project with Firebase added (Android)
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ci-smoke"
          ./gradlew :composeApp:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-firebase-build.log"
      # The lean shape (`--preset lean`, docs/proposals/LIBRARIES-IN-SERVICES-OUT.md Decision 3) is
      # the default with Room off: no Room sources, no KSP. Its proof is compile, here, on every
      # PR — a fresh app, and no add step, because the shape is what is under proof. The L2 run
      # stays on the default shape; this one never reaches it.
      - name: Stamp the lean shape (verify off — the build below IS the verification)
        run: >
          node bin/create-cmp.mjs "$RUNNER_TEMP/ci-smoke-lean"
          --name CiSmokeLean --package com.ci.smokelean
          --preset lean --no-ios --no-verify --yes
      - name: Build the lean shape (Android)
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ci-smoke-lean"
          ./gradlew :composeApp:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-lean-build.log"
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stamp-android-build-log
          path: |
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/android-firebase-build.log
            ${{ runner.temp }}/android-lean-build.log
          if-no-files-found: ignore

  stamp-ios:
    name: stamp + iOS xcodebuild
    runs-on: macos-15 # Apple Silicon — matches the arm64-only simulator build; newer image = newer default Xcode
    needs: test
    # iOS CI is PARKED for now (founder call, 2026-07-03): manual-dispatch only.
    # The leg is proven green (run 28683486610); re-enable per-push by restoring
    # the `|| (push && main)` clause when iOS returns to scope.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install XcodeGen (CocoaPods is preinstalled on macOS runners)
        run: brew install xcodegen
      # Latest-brew XcodeGen + CocoaPods emit projects in the newest Xcode object
      # format; the image's *default* Xcode can lag and then xcodebuild fails with
      # "future Xcode project file format" (exactly what broke run #1 on macos-14:
      # format 77 vs Xcode 15.4). Always select the newest Xcode on the runner so
      # generator and builder agree.
      - name: Select newest installed Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
      - name: Stamp project (iOS on)
        run: >
          node bin/create-cmp.mjs "$RUNNER_TEMP/ci-smoke-ios"
          --name CiSmoke --package com.ci.smoke
          --no-verify --yes
      # The leg builds the app WITH Firebase added, which is the shape the stamp used to
      # produce by default: the iOS half of `add firebase` (FirebaseEmulators.kt, the Swift
      # configure call, the Podfile pods, a mock GoogleService-Info.plist) is what this
      # parked job would prove when it runs.
      - name: Add Firebase to the stamped project
        run: node bin/create-cmp.mjs add firebase "$RUNNER_TEMP/ci-smoke-ios" --no-verify
      # Exact proven path from template/manifest.json `verify.iosLink` + `verify.ios`:
      # XcodeGen -> pod install (LANG=en_US.UTF-8 or CocoaPods trips on encoding)
      # -> xcodebuild constrained to arm64 + a concrete simulator UDID (the KMP
      # embed phase emits only the active-arch slice; a generic destination
      # fails at CreateUniversalBinary).
      - name: Link KMP framework (fast, isolates Kotlin/native failures)
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ci-smoke-ios"
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace 2>&1 | tee "$RUNNER_TEMP/ios-link.log"
      - name: Build stamped project (iOS simulator)
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/ci-smoke-ios/iosApp"
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          xcodegen generate
          pod install
          SIM_UDID=$(xcrun simctl list devices available | grep -Eo '[0-9A-F-]{36}' | head -1)
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp -sdk iphonesimulator \
            -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=x86_64 \
            -destination "id=$SIM_UDID" build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stamp-ios-build-logs
          path: |
            ${{ runner.temp }}/ios-link.log
            ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore

  # ONE NAME FOR THE MATRIX (FIX-PLAN slice 7). `test` reports three contexts,
  # `engine unit tests (20|22|24)`, and a ruleset can only require names it
  # knows; a required `engine unit tests` would never be satisfied and would
  # block every merge. This fan-in is the one context qa/ruleset-create-cmp.json
  # requires, so the matrix can change without editing the ruleset. `always()`
  # so a failed or cancelled leg reports red here rather than skipped — a
  # skipped required check counts as passing.
  tests:
    name: tests
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every engine unit test leg passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "engine unit tests (matrix): $RESULT"
          test "$RESULT" = "success"

  # THE HOOK'S QUESTION, ASKED WHERE THE SESSION CANNOT REACH (GATE-RULES Rule 4,
  # FIX-PLAN slice 7, B-4): what does this PR's diff owe, and is each owed tier
  # attested? `node scripts/proof-plan.mjs --ci` says what it can see — suite and
  # framework-check are re-run by `tests`; review and the L2 runs count only as
  # check runs named `review`, `L2 run`, `Firebase L2 run` on the head commit,
  # never as files committed into the tree (a hashed record invalidates itself,
  # an excluded one is forgeable).
  #
  # THE BASE BRANCH'S CODE JUDGES (Rule 2: the layer you changed cannot certify
  # itself). The PR is checked out; the base branch is added as a second worktree
  # and ITS scripts/proof-plan.mjs is run with `--tree` pointing at the PR. A PR
  # that rewrites the plan is judged by the plan it replaces. The one exception is
  # the bootstrap: a base that predates `--ci` cannot answer, so the PR's own copy
  # runs and the log says so — true exactly once, for the PR that adds the mode.
  #
  # PULL REQUESTS ONLY — skipped on push to main, deliberately. After a
  # rebase-merge the commits on main have new SHAs, so the check runs a reviewer
  # posted on the PR head are not on them and every owed tier would read MISSING:
  # a false red on every merge. And a check after the push refuses nothing — the
  # refusal belongs before it, which is what the ruleset's required check is for.
  #
  # NOT --strict YET (Rule 1: calibrate a gate on a recorded run before wiring it).
  # Without --strict the job REPORTS and exits 0: MISSING and UNKNOWN (the API
  # did not answer) both print their tier lines and refuse nothing. Nothing posts
  # `review` / `L2 run` check runs yet, so a PR that owes one reads MISSING here
  # until that poster exists — the record this job is gathering before --strict
  # and the ruleset make it refuse.
  proof-owed:
    name: proof owed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: What this PR owes, judged by the base branch's plan code
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE_REF"
          judge="$RUNNER_TEMP/base/scripts/proof-plan.mjs"
          if ! grep -q -- '"--ci"' "$judge"; then
            echo "::warning::origin/$BASE_REF's proof-plan.mjs predates --ci; the PR's own copy judges this once (bootstrap, Rule 2 not met for this run)"
            judge="scripts/proof-plan.mjs"
          fi
          node "$judge" --ci --base "origin/$BASE_REF" --tree "$GITHUB_WORKSPACE" --sha "$HEAD_SHA" --repo "$GITHUB_REPOSITORY"
